name: SkinnyLegend
options:
  bundleIdPrefix: com.themarcus125
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.42.0"
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.unconfigured

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    minVersion: 12.0.0
    maxVersion: 99.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    minVersion: 8.0.0
    maxVersion: 99.0.0

targets:
  SkinnyLegend:
    type: application
    platform: iOS
    sources:
      - path: SkinnyLegend
        excludes:
          - Info.plist
          - Resources/ATTRIBUTION.md
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: SkinnyLegend/Info.plist
      properties:
        CFBundleDisplayName: Skinny Legend
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations:
          - vi
          - en
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Chụp ảnh buổi tập hoặc bữa ăn để ghi nhận điểm.
        NSPhotoLibraryUsageDescription: Chọn ảnh buổi tập hoặc bữa ăn từ thư viện để ghi nhận điểm.
        NSLocationWhenInUseUsageDescription: Ghi lại địa điểm bạn tập luyện để hiển thị trong nhật ký nhóm.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themarcus125.skinnylegend
        PRODUCT_NAME: SkinnyLegend
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: SkinnyLegend/SkinnyLegend.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  SkinnyLegendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkinnyLegendTests
    dependencies:
      - target: SkinnyLegend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.themarcus125.skinnylegend.tests

schemes:
  SkinnyLegend:
    build:
      targets:
        SkinnyLegend: all
        SkinnyLegendTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-mockAPI": true
    test:
      config: Debug
      gatherCoverageData: false
      commandLineArguments:
        "-mockAPI": true
        "-AppleLanguages (vi)": true
        "-AppleLocale vi_VN": true
      targets:
        - SkinnyLegendTests
