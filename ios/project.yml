name: SkinnyLegend
options:
  bundleIdPrefix: com.themarcus125
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.42.0"
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Replace with REVERSED_CLIENT_ID from your own `GoogleService-Info.plist` (gitignored, see
    # the README's "Before TestFlight"); Google Sign-In cannot call back without the real value.
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.unconfigured
  configs:
    Debug:
      # Signing off, on purpose: simulator builds and `xcodebuild test` need no identity, and no
      # Apple Developer team is configured yet. Scoped to Debug so a Release archive signs
      # normally once DEVELOPMENT_TEAM is set below.
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      API_BASE_URL: http://localhost:3000
    Release:
      CODE_SIGN_STYLE: Automatic
      # Set to your Apple Developer team id before archiving for TestFlight.
      DEVELOPMENT_TEAM: ""
      # Placeholder: replace with the deployed API's URL before shipping a build.
      API_BASE_URL: https://skinny-legend-api.up.railway.app

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    minVersion: 12.0.0
    # SKI-83: pinned below 13 — Firebase 13 removed the `Messaging.token()` async API the
    # push registrar is built on.
    maxVersion: 12.99.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    minVersion: 8.0.0
    maxVersion: 99.0.0

targets:
  SkinnyLegend:
    type: application
    platform: iOS
    sources:
      - path: SkinnyLegend
        excludes:
          - Info.plist
          - Resources/ATTRIBUTION.md
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: SkinnyLegend/Info.plist
      properties:
        CFBundleDisplayName: Skinny Legend
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations:
          - vi
          - en
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Be Vietnam Pro, the app's text face (OFL — see Resources/ATTRIBUTION.md). Five static
        # weights: 400/500/600/700/800. XcodeGen copies everything under `Resources/` into the
        # bundle root, so these are flat file names.
        UIAppFonts:
          - BeVietnamPro-Regular.ttf
          - BeVietnamPro-Medium.ttf
          - BeVietnamPro-SemiBold.ttf
          - BeVietnamPro-Bold.ttf
          - BeVietnamPro-ExtraBold.ttf
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Per-configuration (see `settings.configs`), so a Release build never points at
        # localhost. `AppMode.resolveBaseURL` reads env first, then this key.
        API_BASE_URL: $(API_BASE_URL)
        NSCameraUsageDescription: Chụp ảnh buổi tập hoặc bữa ăn để ghi nhận điểm.
        NSPhotoLibraryUsageDescription: Chọn ảnh buổi tập hoặc bữa ăn từ thư viện để ghi nhận điểm.
        NSLocationWhenInUseUsageDescription: Ghi lại địa điểm bạn tập luyện để hiển thị trong nhật ký nhóm.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        # Home Screen quick actions (long-press the icon). Titles are keys looked up in
        # InfoPlist.xcstrings; the types are mirrored by `AppShortcut` in Swift.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.themarcus125.skinnylegend.track
            UIApplicationShortcutItemTitle: Ghi nhận
            UIApplicationShortcutItemIconSymbolName: camera.fill
          - UIApplicationShortcutItemType: com.themarcus125.skinnylegend.leaderboard
            UIApplicationShortcutItemTitle: Xếp hạng
            UIApplicationShortcutItemIconSymbolName: trophy.fill
          - UIApplicationShortcutItemType: com.themarcus125.skinnylegend.trends
            UIApplicationShortcutItemTitle: Xu hướng
            UIApplicationShortcutItemIconSymbolName: chart.bar.xaxis
          - UIApplicationShortcutItemType: com.themarcus125.skinnylegend.map
            UIApplicationShortcutItemTitle: Bản đồ
            UIApplicationShortcutItemIconSymbolName: map
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themarcus125.skinnylegend
        PRODUCT_NAME: SkinnyLegend
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: SkinnyLegend/SkinnyLegend.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SkinnyLegendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkinnyLegendTests
    dependencies:
      - target: SkinnyLegend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.themarcus125.skinnylegend.tests

schemes:
  SkinnyLegend:
    build:
      targets:
        SkinnyLegend: all
        SkinnyLegendTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-mockAPI": true
    test:
      config: Debug
      gatherCoverageData: false
      commandLineArguments:
        "-mockAPI": true
        "-AppleLanguages (vi)": true
        "-AppleLocale vi_VN": true
      targets:
        - SkinnyLegendTests
