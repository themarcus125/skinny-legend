services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skinny
      POSTGRES_PASSWORD: skinny
      POSTGRES_DB: skinny
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # Used only by the end-to-end suite (docs/testing/e2e.md). Nothing in dev depends on it.
  auth-emulator:
    build: ./infra/firebase-emulator
    ports: ["9099:9099"]
    healthcheck:
      # The emulator answers GET / with its JSON banner once it is accepting traffic.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9099/ > /dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  pgdata:
