<!doctype html>
<!-- `lang` is rewritten by `src/i18n/provider.tsx` once the locale resolves; `vi` is the source
     of truth, so it is also the honest value before any JavaScript runs. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell paint under the notch; the tab bar pads itself back
         out with env(safe-area-inset-bottom). maximum-scale=1 + user-scalable=no turn page zoom
         off: a pinch on a sheet or the tab bar otherwise leaves the shell zoomed and broken.
         (iOS ignores these two in the browser but honours them for an installed app; the
         touch-action rule in index.css covers the rest.) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EDECF1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />

    <!-- iOS standalone: added to the home screen, the app loses Safari's chrome and gains push. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Skinny Legend" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <title>Skinny Legend</title>

    <!-- Appearance before first paint. React applies the same rule (src/app/theme-provider.tsx),
         but it only runs after hydration, which is one painted light frame too late on a dark
         phone. Keep the storage key and the resolution rule in sync with src/app/theme.ts. -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('skinny.theme');
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* Private mode or a blocked store: fall through to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
